name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: vet + test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: FuzzParseEnvironmentMetrics, pkg: .}
          - {target: FuzzParsePowerConsumed, pkg: .}
          - {target: FuzzMeter, pkg: .}
          - {target: FuzzParseError, pkg: .}
          - {target: FuzzParseTask, pkg: .}
          - {target: FuzzCheckPayload, pkg: .}
          - {target: FuzzParseActionInfo, pkg: .}
          - {target: FuzzPick, pkg: .}
          - {target: FuzzRenderTable, pkg: ./cmd/redfish}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: fuzz
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=30s ${{ matrix.pkg }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
